<!doctype html><meta charset="utf-8"><title>Aircade · Astra controller</title>
<style>*{box-sizing:border-box}body{margin:0;background:#e9f5ff;color:#15304a;font:18px system-ui;width:1024px;height:720px}header{height:62px;padding:14px 25px;background:white;display:flex;justify-content:space-between}img{display:block;width:1024px;height:510px;object-fit:contain;background:#253b54}#rail{margin:12px 420px;width:184px;height:40px;border:2px solid #4489c5;background:linear-gradient(90deg,#afd6ed,#fff,#afd6ed);border-radius:20px;position:relative;cursor:crosshair}#cursor{position:absolute;left:50%;height:36px;width:12px;background:#ed563e;border-radius:6px;pointer-events:none}footer{padding:0 40px;display:flex;justify-content:space-between;align-items:center}button{padding:12px 28px;border:0;border-radius:12px;background:#1677be;color:white;font:bold 20px system-ui}small{font-size:13px}#status{font-size:14px}</style>
<header><b>AIRCADE · YOU CONTROL THE NEAR RACKET</b><span id="status">Waiting for court</span></header>
<img id="court" alt="Live native court. Your racket is nearest the camera.">
<div id="rail"><div id="cursor"></div></div>
<footer><div>Move on the rail to position · click SWING to strike<br><small>Rail is aligned with the court: use the same screen X as the ball. Stroke lasts 3 seconds. No automatic aiming.</small></div><button id="swing">SWING</button></footer>
<script>
let source=null,pending=[],frozen=false,x=0;
const court=document.querySelector('#court'),rail=document.querySelector('#rail');
async function show(f){if(!f)return;source=f.meta;court.src='data:image/jpeg;base64,'+f.image;await court.decode();document.querySelector('#status').textContent=f.label||'8-second flights · 60-second match';}
function send(swing){if(!source)return;const p=fetch('/input',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...source,x,swing})});pending.push(p);}
rail.onpointermove=e=>{x=Math.max(-4.6,Math.min(4.6,4.6-(e.clientX-420)/184*9.2));document.querySelector('#cursor').style.left=(4.6-x)/9.2*100+'%';send(false)};
document.querySelector('#swing').onclick=()=>send(true);
window.arena={show,freeze(v){frozen=v},source(v){source=v},async flush(){await Promise.all(pending);pending=[]}};
setInterval(async()=>{if(!frozen){const r=await fetch('/observation');if(r.ok)await show(await r.json())}},400);
</script>
